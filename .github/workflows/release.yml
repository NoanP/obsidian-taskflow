name: Check and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Validate versions
        run: |
          node -e 'const m=require("./manifest.json"), p=require("./package.json"), v=require("./versions.json"); if(m.version!==p.version || v[m.version]!==m.minAppVersion || !/^\d+\.\d+\.\d+$/.test(m.version)) process.exit(1)'
  release:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: taskflow-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish version with BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; bump the version for updates."
            exit 0
          fi
          python3 - "$VERSION" <<'PY' > release-notes.txt
          import pathlib, sys
          text = pathlib.Path('CHANGELOG.md').read_text()
          heading = '## [' + sys.argv[1] + ']'
          section = text.split(heading, 1)[1].split('\n## [', 1)[0]
          print(heading + section)
          PY
          gh release create "$VERSION" main.js manifest.json styles.css --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.txt
